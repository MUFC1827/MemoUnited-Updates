name: Build private MemoUnited macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-private-release:
    name: macOS arm64 private release
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout public build host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: host
          persist-credentials: false
      - name: Install accepted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
          architecture: arm64
      - name: Checkout accepted private build kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MUFC1827/MemoUnited-macOS-20261009
          ref: 380580c5713a69452252fbbcfe418eeb44a9d7fd
          ssh-key: ${{ secrets.MEMOUNITED_RELEASE_SOURCE_READ_KEY }}
          persist-credentials: false
          path: private-buildkit
      - name: Build and validate privately
        run: >-
          python -B host/publichost/mac_release_host.py
          --source private-buildkit
          --host host
          --key host/.github/keys/mac-720-artifacts.pem
      - name: Upload encrypted release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MemoUnited-macOS-arm64-encrypted
          path: ${{ runner.temp }}/MemoUnited-public-release-output/MemoUnited_macOS_7.2.0_arm64.mucloud
          if-no-files-found: ignore
          retention-days: 1
